<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes App</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="loginBox" class="container">

        <h2>Notes App Login</h2>

        <input type="text" id="username" placeholder="Username">

        <input type="password" id="password" placeholder="Password">

        <button onclick="login()">Login</button>

    </div>

    <div id="notesBox" class="container" style="display:none;">

        <div class="header">
            <h3>Welcome, <span id="user"></span> 👋</h3>
            <button onclick="logout()">Logout</button>
        </div>

        <h1>📝 Notes App</h1>

        <input type="text" id="search" placeholder="Search Notes" onkeyup="searchNotes()">

        <textarea id="noteInput" placeholder="Write your note..."></textarea>

        <button onclick="addNote()">Add Note</button>

        <div id="notesList"></div>

    </div>

    <script src="script.js"></script>

</body>

</html>
